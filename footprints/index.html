<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>足迹地图</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; overflow: hidden; background: #1a1a2e; }
        #map { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

        /* Stats chips */
        .stats-bar {
            position: fixed; top: 16px; left: 16px; z-index: 1000;
            display: flex; gap: 10px;
        }
        .stat-chip {
            background: rgba(20,20,40,0.8); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.08); border-radius: 20px;
            padding: 8px 16px; color: #fff; font-size: 13px;
            display: flex; align-items: center; gap: 6px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.3);
        }
        .stat-chip .num {
            font-weight: 700; font-size: 16px;
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .stat-chip .label { color: rgba(255,255,255,0.5); font-size: 11px; }

        /* Toggle button */
        .toggle-btn {
            position: fixed; bottom: 20px; right: 20px; z-index: 1001;
            width: 48px; height: 48px; border-radius: 50%; border: none;
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            color: #fff; font-size: 20px; cursor: pointer;
            box-shadow: 0 4px 20px rgba(238,90,36,0.4);
            transition: transform 0.3s, box-shadow 0.3s;
            display: flex; align-items: center; justify-content: center;
        }
        .toggle-btn:hover { transform: scale(1.1); box-shadow: 0 6px 28px rgba(238,90,36,0.5); }
        .toggle-btn.active { transform: rotate(45deg); }

        /* City panel */
        .city-panel {
            position: fixed; bottom: 80px; right: 20px; z-index: 1000;
            width: 300px; max-height: 0; overflow: hidden;
            background: rgba(16,16,32,0.88); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.06); border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            transition: max-height 0.4s ease, padding 0.3s ease, opacity 0.3s ease;
            opacity: 0; padding: 0 16px;
        }
        .city-panel.open {
            max-height: 400px; opacity: 1; padding: 16px;
        }
        .panel-search {
            margin-bottom: 12px;
        }
        .panel-search input {
            width: 100%; padding: 8px 12px; background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.08); border-radius: 8px;
            color: #fff; font-size: 13px; outline: none;
        }
        .panel-search input::placeholder { color: rgba(255,255,255,0.3); }
        .panel-search input:focus { border-color: rgba(255,65,108,0.5); }
        .city-scroll {
            max-height: 320px; overflow-y: auto;
        }
        .city-scroll::-webkit-scrollbar { width: 3px; }
        .city-scroll::-webkit-scrollbar-track { background: transparent; }
        .city-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }
        .prov-group { margin-bottom: 10px; }
        .prov-name {
            font-size: 10px; font-weight: 600; color: rgba(255,255,255,0.35);
            text-transform: uppercase; letter-spacing: 1.5px; padding: 4px 0;
            border-bottom: 1px solid rgba(255,255,255,0.04); margin-bottom: 4px;
        }
        .city-item {
            padding: 6px 10px; border-radius: 6px; cursor: pointer;
            color: rgba(255,255,255,0.7); font-size: 13px;
            display: flex; align-items: center; gap: 8px;
            transition: all 0.15s;
        }
        .city-item:hover { background: rgba(255,65,108,0.12); color: #fff; }
        .city-item::before {
            content: ''; width: 5px; height: 5px; border-radius: 50%;
            background: #ff416c; opacity: 0.5; flex-shrink: 0;
        }
        .city-item:hover::before { opacity: 1; }
        .city-item.hidden { display: none; }

        /* Markers */
        .marker-pin {
            width: 12px; height: 12px; border-radius: 50%;
            background: radial-gradient(circle, #ff6b6b, #ee5a24);
            border: 2px solid rgba(255,255,255,0.9);
            box-shadow: 0 0 12px rgba(238,90,36,0.6);
            position: relative;
        }
        .marker-pin::after {
            content: ''; position: absolute; top: 50%; left: 50%;
            width: 40px; height: 40px; margin: -20px 0 0 -20px;
            border-radius: 50%; background: rgba(238,90,36,0.3);
            animation: pulse-ring 2s ease-out infinite;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.3); opacity: 1; }
            100% { transform: scale(1.2); opacity: 0; }
        }

        /* Tooltip */
        .custom-tooltip {
            background: rgba(20,20,40,0.92) !important; backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.1) !important; border-radius: 10px !important;
            color: #fff !important; padding: 8px 14px !important;
            font-size: 13px !important; box-shadow: 0 4px 20px rgba(0,0,0,0.4) !important;
        }
        .custom-tooltip .tooltip-city { font-size: 14px; font-weight: 600; }
        .custom-tooltip .tooltip-province { font-size: 11px; color: rgba(255,255,255,0.45); margin-top: 1px; }
        .leaflet-tooltip-top:before, .leaflet-tooltip-bottom:before,
        .leaflet-tooltip-left:before, .leaflet-tooltip-right:before { display: none !important; }

        /* Leaflet controls */
        .leaflet-control-zoom { border: none !important; box-shadow: 0 4px 16px rgba(0,0,0,0.3) !important; }
        .leaflet-control-zoom a {
            background: rgba(20,20,40,0.9) !important; color: rgba(255,255,255,0.8) !important;
            border: 1px solid rgba(255,255,255,0.08) !important;
            width: 32px !important; height: 32px !important; line-height: 32px !important; font-size: 16px !important;
        }
        .leaflet-control-zoom a:hover { background: rgba(40,40,60,0.95) !important; }
        .leaflet-control-zoom-in { border-radius: 8px 8px 0 0 !important; }
        .leaflet-control-zoom-out { border-radius: 0 0 8px 8px !important; border-top: none !important; }
        .leaflet-bottom.leaflet-left .leaflet-control-zoom { margin-bottom: 20px; margin-left: 16px; }

        /* Mobile */
        @media (max-width: 768px) {
            .stats-bar { top: 8px; left: 8px; gap: 6px; }
            .stat-chip { padding: 5px 10px; font-size: 11px; border-radius: 14px; }
            .stat-chip .num { font-size: 13px; }
            .toggle-btn { bottom: 14px; right: 14px; width: 40px; height: 40px; }
            .toggle-btn svg { width: 16px; height: 16px; }
            .city-panel { right: 8px; left: 8px; width: auto; bottom: 64px; border-radius: 12px; }
            .city-panel.open { max-height: 50vh; padding: 12px; }
            .leaflet-bottom.leaflet-left .leaflet-control-zoom { margin-bottom: 14px; margin-left: 10px; }
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <div class="stats-bar">
        <div class="stat-chip">
            <span class="num" id="cityCount">0</span>
            <span class="label">城市</span>
        </div>
        <div class="stat-chip">
            <span class="num" id="provCount">0</span>
            <span class="label">省份</span>
        </div>
    </div>

    <button class="toggle-btn" id="toggleBtn" title="城市列表">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <line x1="3" y1="6" x2="21" y2="6"/>
            <line x1="3" y1="12" x2="21" y2="12"/>
            <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
    </button>

    <div class="city-panel" id="cityPanel">
        <div class="panel-search">
            <input type="text" id="searchInput" placeholder="搜索城市..." />
        </div>
        <div class="city-scroll" id="cityList"></div>
    </div>

    <script>
        const cities = [
            [39.90, 116.41, '北京', '北京'],
            [31.24, 121.50, '上海', '上海'],
            [34.37, 109.21, '西安·临潼', '陕西'],
            [34.49, 110.07, '渭南·华阴', '陕西'],
            [32.59, 117.02, '淮南', '安徽'],
            [30.94, 118.76, '宣城', '安徽'],
            [30.14, 118.16, '黄山', '安徽'],
            [31.82, 117.23, '合肥', '安徽'],
            [31.74, 116.52, '六安', '安徽'],
            [32.81, 117.52, '凤阳', '安徽'],
            [28.23, 112.94, '长沙', '湖南'],
            [30.57, 104.07, '成都', '四川'],
            [30.99, 103.65, '都江堰', '四川'],
            [30.98, 104.28, '广汉', '四川'],
            [23.13, 113.26, '广州', '广东'],
            [22.30, 114.18, '香港', '广东'],
            [22.23, 113.54, '珠海', '广东'],
            [22.52, 114.06, '深圳', '广东'],
            [30.25, 120.21, '杭州', '浙江'],
            [31.30, 120.59, '苏州', '江苏'],
            [29.86, 121.62, '宁波', '浙江'],
            [36.06, 120.31, '青岛', '山东'],
            [28.68, 115.86, '南昌', '江西'],
            [28.90, 118.07, '上饶·三清山', '江西'],
            [30.49, 114.83, '武汉', '湖北'],
        ];

        const provinces = {};
        cities.forEach(([lat, lng, city, prov]) => {
            if (!provinces[prov]) provinces[prov] = [];
            provinces[prov].push({ lat, lng, city });
        });

        // Animated counter
        function animateCount(el, target) {
            let cur = 0;
            const step = Math.max(1, Math.floor(target / 25));
            const t = setInterval(() => {
                cur += step;
                if (cur >= target) { cur = target; clearInterval(t); }
                el.textContent = cur;
            }, 30);
        }
        animateCount(document.getElementById('cityCount'), cities.length);
        animateCount(document.getElementById('provCount'), Object.keys(provinces).length);

        // Map
        const map = L.map('map', {
            center: [32.5, 108], zoom: 4,
            zoomControl: false, attributionControl: false,
            maxBounds: [[0, 70], [60, 145]], minZoom: 3, maxZoom: 10,
        });
        L.control.zoom({ position: 'bottomleft' }).addTo(map);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OSM &copy; CARTO',
            subdomains: 'abcd', maxZoom: 19,
        }).addTo(map);

        const markerIcon = L.divIcon({ className: '', html: '<div class="marker-pin"></div>', iconSize: [12, 12], iconAnchor: [6, 6] });
        const markers = [];
        cities.forEach(([lat, lng, city, prov]) => {
            const m = L.marker([lat, lng], { icon: markerIcon })
                .addTo(map)
                .bindTooltip(`<div class="tooltip-city">${city}</div><div class="tooltip-province">${prov}</div>`,
                    { direction: 'top', offset: [0, -8], className: 'custom-tooltip' });
            m.cityData = { lat, lng, city };
            markers.push(m);
        });

        // City list
        const listEl = document.getElementById('cityList');
        Object.keys(provinces).sort().forEach(prov => {
            const g = document.createElement('div');
            g.className = 'prov-group';
            g.innerHTML = `<div class="prov-name">${prov}</div>`;
            provinces[prov].forEach(({ lat, lng, city }) => {
                const item = document.createElement('div');
                item.className = 'city-item';
                item.textContent = city;
                item.dataset.city = city.toLowerCase();
                item.addEventListener('click', () => {
                    map.flyTo([lat, lng], 7, { duration: 0.8 });
                    const m = markers.find(m => m.cityData.lat === lat && m.cityData.lng === lng);
                    if (m) { m.openTooltip(); setTimeout(() => m.closeTooltip(), 2500); }
                    document.querySelectorAll('.city-item').forEach(el => el.style.background = '');
                    item.style.background = 'rgba(255,65,108,0.15)';
                });
                g.appendChild(item);
            });
            listEl.appendChild(g);
        });

        // Toggle panel
        const btn = document.getElementById('toggleBtn');
        const panel = document.getElementById('cityPanel');
        btn.addEventListener('click', () => {
            panel.classList.toggle('open');
            btn.classList.toggle('active');
        });

        // Search
        document.getElementById('searchInput').addEventListener('input', e => {
            const q = e.target.value.toLowerCase();
            document.querySelectorAll('.city-item').forEach(i => i.classList.toggle('hidden', q && !i.dataset.city.includes(q)));
            document.querySelectorAll('.prov-group').forEach(g => {
                g.style.display = g.querySelectorAll('.city-item:not(.hidden)').length ? '' : 'none';
            });
        });

        // Click map to deselect
        map.on('click', () => document.querySelectorAll('.city-item').forEach(el => el.style.background = ''));
    </script>
</body>
</html>
